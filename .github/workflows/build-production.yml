name: Build Eleventy and deploy to web host

on:
  push:
    branches:
      - main
  schedule:
    # Run every 60 minutes to update Spotify track
    - cron: "*/60 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get Latest Code
        uses: actions/checkout@v4

      - name: 📨 Install dependencies
        run: npm install

      - name: 🎵 Update Spotify track
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: npm run update-track

      - name: 1️⃣1️⃣ Build Site with CSS
        run: npm run build

      - name: 💾 Commit Spotify updates (pre-deploy)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/currentTrack.json
          git diff --staged --quiet || git commit -m "Update Spotify track [skip ci]"
          git push

      - name: 🧑🏻‍💻 Deploy
        uses: AbleLincoln/push-to-sftp@v2.1
        with:
          host: ronnie.fyi
          port: 22
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}
          sourceDir: ./_site/
          targetDir: ./ronnie.fyi/

      - name: ⏱️ Wait for deployment to propagate
        run: sleep 30

      - name: 🦋 Post new content to Bluesky (after successful deploy)
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: npm run post-to-bluesky

      - name: 💾 Commit Bluesky tracking file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .bluesky-posted.json
          git diff --staged --quiet || git commit -m "Update Bluesky posted files [skip ci]"
          git push
