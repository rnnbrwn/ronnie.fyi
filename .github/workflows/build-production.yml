name: Build Eleventy and deploy to web host

on:
  push:
    branches:
      - main
  schedule:
    # Run every 60 minutes to update Spotify track
    - cron: "0 * * * *"
  repository_dispatch:
    # Triggered by Contentful webhooks
    types: [contentful_publish, contentful_unpublish]
  workflow_dispatch: # Allow manual triggering

# Prevent duplicate social media posts by cancelling superseded builds
concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📝 Log trigger information
        run: |
          echo "🔍 Workflow triggered by: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "🎯 Dispatch type: ${{ github.event.action }}"
            echo "📦 Client payload: ${{ toJson(github.event.client_payload) }}"
          fi

      - name: 🚚 Get Latest Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📨 Install dependencies
        run: npm install

      - name: 🎵 Update Spotify track
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: npm run update-track

      - name: 1️⃣1️⃣ Build Site with CSS
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: npm run build

      - name: 💾 Commit Spotify updates (pre-deploy)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin main
          git reset --hard origin/main
          git add _data/currentTrack.json
          if ! git diff --staged --quiet; then
            git commit -m "Update Spotify track [skip ci]"
            git push origin main
          fi

      - name: 🧑🏻‍💻 Deploy
        uses: AbleLincoln/push-to-sftp@v2.1
        with:
          host: ronnie.fyi
          port: 22
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}
          sourceDir: ./_site/
          targetDir: ./ronnie.fyi/

      - name: ⏱️ Wait for deployment to propagate
        run: sleep 60

      - name: 🔍 Verify site is live
        run: |
          echo "Checking if site is accessible..."
          if curl -f -s -o /dev/null "https://ronnie.fyi/"; then
            echo "✅ Site is accessible"
          else
            echo "❌ Site is not accessible yet, waiting more..."
            sleep 30
            if curl -f -s -o /dev/null "https://ronnie.fyi/"; then
              echo "✅ Site is now accessible"
            else
              echo "⚠️ Site still not accessible, but continuing with Bluesky posting (URL validation will handle this)"
            fi
          fi

      - name: 🦋 Post new content to Bluesky (after successful deploy)
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: npm run post-to-bluesky

      - name: 💾 Commit Bluesky tracking file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .bluesky-posted.json
          if ! git diff --staged --quiet; then
            git commit -m "Update Bluesky posted files [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
