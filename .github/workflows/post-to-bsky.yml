name: Post to Bluesky

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy to Dreamhost
    types:
      - completed
    branches:
      - main

jobs:
  post:
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: read
    steps:
      - name: Skip if deploy failed
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "Deploy did not succeed, skipping."
          exit 0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Post to Bluesky
        env:
          BSKY_IDENTIFIER: ${{ secrets.BLUESKY_USERNAME }}
          BSKY_APP_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/post-to-bsky.mjs
