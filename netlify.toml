[build]
  publish = "_site"
  command = "npm run build" # default for prod

[build.environment]
  NODE_VERSION = "20"

# Production
[context.production]
  command = "npm run build"

# Pull-request builds (Deploy Previews) — THIS is what your logs show
[context.deploy-preview]
  command = "npm run build:preview"
  [context.deploy-preview.environment]
    USE_PREVIEW = "true"
    CONTENTFUL_ENVIRONMENT = "master"
    SECRETS_SCAN_OMIT_KEYS = "CONTENTFUL_SPACE_ID"
    SECRETS_SCAN_OMIT_PATHS = "_site/feed/*,_site/posts/*"

# Direct branch deploys of contentful-preview
[context."branch:contentful-preview"]
  command = "npm run build:preview"
  [context."branch:contentful-preview".environment]
    USE_PREVIEW = "true"
    CONTENTFUL_ENVIRONMENT = "master"
    SECRETS_SCAN_OMIT_KEYS = "CONTENTFUL_SPACE_ID"
    SECRETS_SCAN_OMIT_PATHS = "_site/feed/*,_site/posts/*"
