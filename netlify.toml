[build]
  publish = "_site"
  # no default command here

[build.environment]
  NODE_VERSION = "20"

# Production context: decide at runtime based on BRANCH
[context.production]
  # If BRANCH=main → prod build; else → preview build with USE_PREVIEW=true
  command = "bash -lc 'if [ \"$BRANCH\" = \"main\" ]; then npm run build; else USE_PREVIEW=true npm run build:preview; fi'"
  [context.production.environment]
    CONTENTFUL_ENVIRONMENT = "master"
    SECRETS_SCAN_OMIT_KEYS = "CONTENTFUL_SPACE_ID"
    SECRETS_SCAN_OMIT_PATHS = "_site/feed/*,_site/posts/*"

# All non-main branch deploys
[context.branch-deploy]
  command = "npm run build:preview"
  [context.branch-deploy.environment]
    USE_PREVIEW = "true"
    CONTENTFUL_ENVIRONMENT = "master"
    SECRETS_SCAN_OMIT_KEYS = "CONTENTFUL_SPACE_ID"
    SECRETS_SCAN_OMIT_PATHS = "_site/feed/*,_site/posts/*"

# Pull-request builds
[context.deploy-preview]
  command = "npm run build:preview"
  [context.deploy-preview.environment]
    USE_PREVIEW = "true"
    CONTENTFUL_ENVIRONMENT = "master"
    SECRETS_SCAN_OMIT_KEYS = "CONTENTFUL_SPACE_ID"
    SECRETS_SCAN_OMIT_PATHS = "_site/feed/*,_site/posts/*"
