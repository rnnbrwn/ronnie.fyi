[build]
  publish = "_site"
  # Skip builds for PRs, and for branch deploys that aren't contentful-preview.
  # Netlify skips the build when this command exits 0; exit 1 means "go ahead".
  ignore = "bash -lc 'if [ \"$CONTEXT\" = \"deploy-preview\" ]; then echo skip && exit 0; fi; if [ \"$CONTEXT\" = \"branch-deploy\" ] && [ \"$BRANCH\" != \"contentful-preview\" ]; then echo skip && exit 0; fi; exit 1'"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------
# Production context (used when a site treats a branch as its "production branch")
# If BRANCH=main → prod build; otherwise (e.g., contentful-preview) → preview build
# ---------------------------
[context.production]
  command = "bash -lc 'if [ \"$BRANCH\" = \"main\" ]; then npm run build; else USE_PREVIEW=true npm run build:preview; fi'"
  [context.production.environment]
    CONTENTFUL_ENVIRONMENT = "master"
    CONTENTFUL_SPACE_ID = "YOUR_SPACE_ID_HERE"
    SECRETS_SCAN_OMIT_KEYS = "CONTENTFUL_SPACE_ID"
    SECRETS_SCAN_OMIT_PATHS = "_site/feed/*,_site/posts/*"

# ---------------------------
# Branch deploys (non-main branches)
# Only contentful-preview actually builds (others are skipped by the ignore rule)
# ---------------------------
[context.branch-deploy]
  command = "npm run build:preview"
  [context.branch-deploy.environment]
    USE_PREVIEW = "true"
    CONTENTFUL_ENVIRONMENT = "master"
    CONTENTFUL_SPACE_ID = "YOUR_SPACE_ID_HERE"
    SECRETS_SCAN_OMIT_KEYS = "CONTENTFUL_SPACE_ID"
    SECRETS_SCAN_OMIT_PATHS = "_site/feed/*,_site/posts/*"

# ---------------------------
# Pull request builds (Deploy Previews)
# These are skipped by the ignore rule above, but we keep the block for clarity.
# ---------------------------
[context.deploy-preview]
  command = "npm run build:preview"
  [context.deploy-preview.environment]
    USE_PREVIEW = "true"
    CONTENTFUL_ENVIRONMENT = "master"
    CONTENTFUL_SPACE_ID = "YOUR_SPACE_ID_HERE"
    SECRETS_SCAN_OMIT_KEYS = "CONTENTFUL_SPACE_ID"
    SECRETS_SCAN_OMIT_PATHS = "_site/feed/*,_site/posts/*"
